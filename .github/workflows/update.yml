name: Update deals

# 定时抓取 → 生成站点 → 提交回仓库 →（可选）推送到自有服务器
#
# 为什么用 GitHub Actions 抓取而不是自有服务器：
#   Actions 每次运行都是**不同的云 IP**，可避开 Cloudflare 对固定 IP 的拦截；
#   而站点仍可发布到自己的域名与服务器。

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update.yml'
      - 'letdeals/**'
      - 'assets/**'
      - 'deploy/*.sh'
      - 'tools/*.py'
      - 'tests/**'
  workflow_call:
    inputs:
      target_repository:
        description: 'Repository whose main branch will be refreshed'
        required: true
        type: string
      with_replies:
        type: boolean
        default: true
      recent_days:
        type: string
        default: '90'
    secrets:
      REPO_PUSH_KEY:
        description: 'Write-enabled deploy key limited to target_repository'
        required: true
      LDR_DEPLOY_SSH_KEY:
        description: 'Optional existing own-server deployment key'
        required: false
    outputs:
      refreshed_sha:
        description: 'Original repository revision after refreshing generated files'
        value: ${{ jobs.update.outputs.refreshed_sha }}
  workflow_dispatch:
    inputs:
      with_replies:
        description: '抓取回帖（库存更准，耗时更长）'
        type: boolean
        default: true
      recent_days:
        description: '只保留最近 N 天（0=全部）'
        type: string
        default: '90'

permissions:
  contents: write

# 避免上一次未跑完时重复触发
concurrency:
  group: update-deals
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      refreshed_sha: ${{ steps.publish.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target_repository || github.repository }}
          ref: main
          ssh-key: ${{ secrets.REPO_PUSH_KEY }}

      - name: Record build source
        run: echo "BUILD_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest

      - name: Run tests
        run: python -m pytest tests -q

      - name: Fetch, extract and build site
        id: build
        env:
          # 站点与域名配置（在仓库 Settings → Variables 中设置）
          LDR_SITE_TITLE: ${{ vars.LDR_SITE_TITLE || '大坝的VPS优惠大超市' }}
          LDR_SITE_URL: ${{ vars.LDR_SITE_URL || 'https://vps.869hr.uk' }}
          LDR_SITE_DESC: ${{ vars.LDR_SITE_DESC || '自动汇总 LowEndTalk / LowEndBox 的 VPS 优惠活动，标注折扣力度、循环折扣与库存状态。' }}
          LDR_SITE_FOOTER: ${{ vars.LDR_SITE_FOOTER || 'Telegram：https://t.me/tgmShare/3385' }}
          LDR_AFFILIATES: ${{ vars.LDR_AFFILIATES }}
          # 抓取参数：手动触发时用输入值，定时触发时用默认值
          WITH_REPLIES: ${{ inputs.target_repository != '' && format('{0}', inputs.with_replies) || github.event.inputs.with_replies || '1' }}
          RECENT_DAYS: ${{ inputs.recent_days || github.event.inputs.recent_days || '90' }}
          PYTHON: python
        run: bash deploy/run_pipeline.sh

      - name: Verify output is non-empty
        # 安全网：抓取失败或全部被过滤时，拒绝提交，保留上次数据
        run: |
          COUNT=$(python -c "import json;print(json.load(open('data/deals.json'))['count'])")
          echo "记录数: $COUNT"
          if [ "$COUNT" -lt 1 ]; then
            echo "::error::记录数为 0，拒绝提交（保留上次数据）"
            exit 1
          fi

      - name: Audit revenue links and price context
        env:
          LDR_AFFILIATES: ${{ vars.LDR_AFFILIATES }}
        run: python -m tools.audit_site

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ github.run_number }}
          path: site/
          retention-days: 7
          if-no-files-found: error

      - name: Commit refreshed data
        id: publish
        run: |
          bash deploy/commit_refresh.sh
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # 可选：推送到自有服务器（配置 LDR_DEPLOY_HOST 后自动启用）
      - name: Deploy to own server
        if: ${{ vars.LDR_DEPLOY_HOST != '' }}
        env:
          SSH_KEY: ${{ secrets.LDR_DEPLOY_SSH_KEY }}
          HOST: ${{ vars.LDR_DEPLOY_HOST }}
          USER: ${{ vars.LDR_DEPLOY_USER }}
          TARGET: ${{ vars.LDR_DEPLOY_PATH }}
          PORT: ${{ vars.LDR_DEPLOY_PORT || '22' }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::warning::未配置 LDR_DEPLOY_SSH_KEY，跳过部署"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # 首次连接自动接受主机指纹；更高安全性可改为预置 known_hosts
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key -p $PORT" \
            site/ "$USER@$HOST:$TARGET/"
          echo "已推送到 $USER@$HOST:$TARGET/"

      - name: Verify public deployment
        id: live
        # Production cannot report success without checking the actual website.
        if: ${{ github.repository == 'wlzh/let-deals-radar' || inputs.target_repository == 'wlzh/let-deals-radar' || vars.LDR_VERIFY_LIVE == 'true' }}
        env:
          LDR_SITE_URL: ${{ vars.LDR_SITE_URL || 'https://vps.869hr.uk' }}
        run: python -m tools.verify_live --url "$LDR_SITE_URL" --attempts 40 --delay 15

      - name: Publish refresh summary
        if: ${{ always() }}
        env:
          BUILD_RESULT: ${{ steps.build.outcome }}
          COMMIT_RESULT: ${{ steps.publish.outcome }}
          LIVE_RESULT: ${{ steps.live.outcome }}
          REFRESHED_SHA: ${{ steps.publish.outputs.sha }}
          SITE_URL: ${{ vars.LDR_SITE_URL || 'https://vps.869hr.uk' }}
          TARGET_REPO: ${{ inputs.target_repository || github.repository }}
        run: |
          {
            echo '## Deal refresh result'
            printf '\nRepository: `%s`\n' "$TARGET_REPO"
            printf '\n| Gate | Result |\n| --- | --- |\n'
            printf '| Fetch and build | %s |\n' "$BUILD_RESULT"
            printf '| Commit generated files | %s |\n' "$COMMIT_RESULT"
            printf '| Public HTML, deals JSON and sitemap | %s |\n' "$LIVE_RESULT"
            printf '\nPublished revision: `%s`\n' "$REFRESHED_SHA"
            printf '\nWebsite: %s\n' "$SITE_URL"
            echo 'A successful commit alone is not proof of a successful public deployment.'
          } >> "$GITHUB_STEP_SUMMARY"
